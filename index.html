<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SouthCoast Eats</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#174f4a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:720px;margin:auto;padding:16px 10px 40px}.top{display:flex;gap:10px;align-items:center}.logo{background:#174f4a;color:#fff;padding:11px;border-radius:13px;font-weight:900}.brand{font-family:Georgia,serif;flex:1}.welcome{padding:35px 2px 22px}.k{color:#e66a49;font-size:11px;font-weight:900;letter-spacing:.15em}.welcome h1{font:clamp(2.5rem,9vw,4rem) Georgia,serif;line-height:.97;margin:0}.sub,.hint{color:#6a7774;font-size:16px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:24px;box-shadow:0 10px 35px #103b3812}.step{padding:18px;border-bottom:1px solid #dfe6e2}.title{display:flex;font-size:16px;gap:12px;align-items:center;margin-bottom:15px}.num{background:#f8e8e2;color:#e66a49;border-radius:50%;padding:7px 11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice,.town,.sort{min-height:54px;border:1px solid #dfe6e2;background:#fff;color:#174f4a;border-radius:14px;padding:12px;font-weight:700;font-size:17px}.choice.selected{background:#174f4a;color:#fff}.wide{grid-column:1/-1}.loc{width:100%;min-height:82px;border:2px solid #e66a49;background:#f8e8e2;border-radius:14px;text-align:left;padding:14px;font-weight:700;font-size:17px}.loc small{display:block;color:#6a7774;margin-top:4px}.or{text-align:center;color:#9aa5a2;margin:10px;font-size:16px}.town{width:100%;font-size:17px}.action{padding:20px 2px;text-align:center}.find{width:100%;min-height:60px;border:0;border-radius:17px;background:#e66a49;color:#fff;font-weight:900;font-size:18px}.results{margin-top:16px;padding:20px}.result{padding:14px 0;border-bottom:1px solid #dfe6e2}.result h3{margin:0;font-size:20px}.result p{color:#6a7774;margin:6px 0;font-size:16px}.pill{display:inline-block;background:#f8e8e2;border-radius:999px;padding:5px 8px;margin:4px;font-size:13px}.sortrow{display:flex;align-items:center;gap:8px;margin:12px 0}.sort{min-height:46px;font-size:16px}.testtime{margin-top:12px;padding:14px;background:#f0f3f1;border-radius:14px;font-size:14px}.testtime input{width:100%;margin-top:6px}
</style></head><body><main class="app"><header class="top"><div class="logo">SE</div><div class="brand">SouthCoast <b>Eats</b></div></header>
<section class="welcome"><p class="k">LOCAL FOOD • YOUR WAY</p><h1>What are you in the mood for?</h1><p class="sub">A few quick choices and we'll narrow it down.</p></section>
<section class="card">
<div class="step"><div class="title"><span class="num">1</span><div><small style="font-size:13px">FIRST</small><h3>Where are you?</h3></div></div><button class="loc" id="loc">📍 <strong>Use my current location</strong><small>Best option — we'll find what's nearby</small></button><div class="or">OR</div><select class="town" id="town"><option value="">Choose a town</option><option>Tiverton</option><option>Fall River</option></select></div>
<div class="step"><div class="title"><span class="num">2</span><div><small style="font-size:13px">THEN</small><h3>What sounds good?</h3></div></div><div class="grid" id="food">
<button class="choice" data-v="pizza">🍕 Pizza</button><button class="choice" data-v="chicken">🍗 Chicken</button><button class="choice" data-v="pub_burger">🍔 Pub / Burger</button><button class="choice" data-v="mexican">🌮 Mexican</button><button class="choice" data-v="chinese">🥡 Chinese</button><button class="choice" data-v="seafood">🦞 Seafood</button><button class="choice" data-v="italian">🍝 Italian</button><button class="choice" data-v="breakfast">🥞 Breakfast</button><button class="choice" data-v="coffee">☕ Coffee / Bakery / Donuts</button><button class="choice" data-v="bbq">🔥 BBQ</button><button class="choice wide selected" data-v="">🤷 Surprise me</button></div></div>
<div class="step"><div class="title"><span class="num">3</span><div><small style="font-size:13px">OPTIONAL</small><h3>How do you want it?</h3></div></div><div class="grid" id="service"><button class="choice selected" data-v="">🤷 No preference</button><button class="choice" data-v="dine_in">🍽️ Sit down</button><button class="choice" data-v="takeout">🥡 Takeout</button><button class="choice" data-v="drive_through">🚗 Drive-through</button><button class="choice" data-v="delivery">🛵 Delivery</button></div></div></section>
<div class="action"><button class="find" id="find">Show me some options →</button><p class="hint">We'll recommend first. Sort the results afterward.</p><div class="testtime"><b>Developer test time</b><input id="time" type="time"></div></div>
<section class="card results" id="results" hidden></section></main>
<script>
let data=[],food="",service="",town="",sort="recommended",$=s=>document.querySelector(s);
function wire(id,set){document.querySelectorAll("#"+id+" .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll("#"+id+" .choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");set(b.dataset.v)})}
function match(r){if(town&&r.town!==town)return false;if(service&&!r.services.includes(service))return false;if(!food)return true;let t=[...r.cuisines,...r.tags].map(x=>String(x).toLowerCase()),m={pizza:["pizza"],chicken:["chicken"],pub_burger:["pub","burgers","wings"],mexican:["mexican"],chinese:["chinese"],seafood:["seafood"],italian:["italian"],breakfast:["breakfast","brunch"],coffee:["coffee","bakery","donuts"],bbq:["bbq"]};return m[food].some(x=>t.includes(x))}
function categoryFit(r){if(!food)return 5;const f=food.toLowerCase();const cs=(r.cuisines||[]).map(x=>String(x).toLowerCase());const tags=(r.tags||[]).map(x=>String(x).toLowerCase());if(cs[0]===f)return 10;if(cs.includes(f))return 7;if(tags.includes(f))return 6;return 0}
function score(r){const fit=categoryFit(r);if(sort==="quality")return r.quality+fit*.01;if(sort==="deal")return r.deal+fit*.01;if(sort==="quickest")return r.speed+fit*.01;if(sort==="closest")return -r.distance+fit*.01;return r.quality*.25+r.deal*.15+r.speed*.15+(10-r.distance)*.15+fit*.3}
function render(list){list=[...list].sort((a,b)=>score(b)-score(a));let o=$("#results");o.hidden=false;o.innerHTML='<p class="k">YOUR OPTIONS</p><h2>'+list.length+' matches</h2><div class="sortrow"><label>Sort by</label><select class="sort" id="sort"><option value="recommended">Recommended</option><option value="closest">Closest</option><option value="quality">Best quality</option><option value="deal">Best deal</option><option value="quickest">Quickest</option></select></div><p class="hint">New search starts at Recommended. Sorting only changes the current results.</p>'+list.map((r,i)=>'<article class="result"><h3>'+((i===0&&sort==="recommended")?"⭐ ":"")+r.name+'</h3><p>'+r.town+', '+r.state+' · '+r.cuisines.join(" • ")+'</p><span class="pill">quality '+r.quality+'</span><span class="pill">deal '+r.deal+'</span><span class="pill">speed '+r.speed+'</span><span class="pill">'+r.distance+' mi</span></article>').join("");$("#sort").value=sort;$("#sort").onchange=e=>{sort=e.target.value;render(list)}}
function show(){sort="recommended";render(data.filter(match))}
async function init(){data=await(await fetch("./data/restaurants.json")).json();wire("food",v=>food=v);wire("service",v=>service=v);$("#town").onchange=e=>town=e.target.value;$("#loc").onclick=()=>{town="";$("#town").value="";$("#loc small").textContent="Current location selected"};$("#find").onclick=show}init();
</script></body></html>
